name: Verify pinned Native and OwnTone stacks

# Test and compile the exact patched engine and OwnTone queue purpose before merge.
on:
  push:
    branches: [main]
    paths:
      - "podconnect/patches/**"
      - "podconnect/Dockerfile"
      - ".github/fixtures/**"
      - ".github/workflows/verify-aliases-patch.yaml"
  pull_request:
    paths:
      - "podconnect/patches/**"
      - "podconnect/Dockerfile"
      - ".github/fixtures/**"
  workflow_dispatch:

# Keep producers and the composed-fixture consumer on one supported ABI.
# ubuntu-latest rolled to 26.04; its cold dependency download exhausted this job.
jobs:
  build-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install go-librespot C deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libflac-dev libasound2-dev libvorbis-dev libogg-dev
      - name: Clone go-librespot v0.7.3
        run: git clone --depth 1 --branch v0.7.3 https://github.com/devgianlu/go-librespot.git /tmp/gl
      - name: Verify and apply the complete pinned Native patch stack
        run: |
          cd /tmp/gl
          test "$(git rev-parse HEAD)" = c191a43c548e698c1dfc83590665f455fc54f084
          patch_dir="$GITHUB_WORKSPACE/podconnect/patches"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/native-stack.sha256" | sha256sum -c -
          for patch in aliases-v0.7.3.patch recovery-v0.7.3.patch autoplay-v0.7.3.patch context-commit-v0.7.3.patch volume-action-v0.7.3.patch initial-publication-v0.7.3.patch queue-occurrence-v0.7.3.patch room-transport-native.patch room-volume-native.patch room-burst-native.patch room-start35-native.patch room-start35-native-amendment.patch room-move-native.patch; do
            git apply --check "$patch_dir/$patch"
            git apply "$patch_dir/$patch"
          done
          git apply --check -p2 "$patch_dir/room-retirement-native.patch"
          git apply -p2 "$patch_dir/room-retirement-native.patch"
          for patch in room-startcredit-handoff-native.patch room-startcredit-reviewfix-native.patch room-queue-native.patch room-next-native.patch connect-recovery-native.patch connect-recovery-diagnostics-native.patch paused-route-native.patch vorbis-cleanup-native.patch room-start-diagnostics-native.patch paused-track-native.patch connect-output-admission-diagnostics-native.patch connect-closed-prior-native.patch connect-output-failure-native.patch connect-no-output-transport-native.patch pipe-control-liveness-native.patch connect-load-failure-native.patch connect-paused-load-receipt-native.patch connect-explicit-resume-native.patch connect-prepared-start-shutdown-native.patch exact-transferred-track-native.patch direct-native-pause-native.patch; do
            git apply --check "$patch_dir/$patch"
            git apply "$patch_dir/$patch"
          done
          # These are the same final Native suffix slots used by Docker.
          # The unified tests already include the selected-content clock fixture.
          for patch in room-release-native.patch room-release-native-tests.patch move-quiesce-native.patch move-quiesce-native-tests.patch room-owner-parity-native.patch room-owner-parity-native-tests.patch; do
            git apply --check "$patch_dir/$patch"
            git apply "$patch_dir/$patch"
          done
      - name: Test Native queue, transport, output and retained packages
        run: cd /tmp/gl && go test -race ./daemon ./player ./tracks ./output ./zeroconf ./spclient ./vorbis && go vet ./daemon ./player ./tracks ./output ./zeroconf ./spclient ./vorbis
      - name: Reuse tested Native package cache for composed fixture binary
        run: cd /tmp/gl && go test -race -c -o /tmp/native-tests ./daemon
      - uses: actions/upload-artifact@v4
        with:
          name: selected-native-tests
          path: /tmp/native-tests
          if-no-files-found: error
          retention-days: 3
      - name: Build patched fork
        run: cd /tmp/gl && go build -trimpath -o /tmp/go-librespot-fork ./cmd/daemon
      - name: Smoke-check binary
        run: /tmp/go-librespot-fork --help >/dev/null 2>&1 || test $? -eq 0 -o $? -eq 1

  build-owntone:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OwnTone build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential git autoconf automake libtool gettext gawk gperf bison flex pkg-config
          libsqlite3-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libavutil-dev
          libasound2-dev libgcrypt20-dev libavahi-client-dev zlib1g-dev libevent-dev libplist-dev
          libsodium-dev libjson-c-dev libwebsockets-dev libcurl4-openssl-dev libprotobuf-c-dev
          libunistring-dev libgnutls28-dev libconfuse-dev libxml2-dev nodejs npm ca-certificates
          libflac-dev libvorbis-dev libogg-dev
      - name: Verify and apply the complete pinned OwnTone patch stack
        run: |
          git clone --depth 1 --branch 29.2 https://github.com/owntone/owntone-server.git /tmp/owntone
          cd /tmp/owntone
          test "$(git rev-parse HEAD)" = fa607a02768d9e29cd87065ac30ac66ea673f1ae
          patch_dir="$GITHUB_WORKSPACE/podconnect/patches"
          for patch in native-attention-fa607.patch room-transport-owntone.patch room-volume-owntone.patch room-burst-owntone.patch; do
            git apply --check "$patch_dir/$patch"
            git apply "$patch_dir/$patch"
          done
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/owntone-move.sha256" | sha256sum -c -
          git apply --check "$patch_dir/room-move-owntone.patch"
          git apply "$patch_dir/room-move-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/owntone-queue.sha256" | sha256sum -c -
          git apply --check "$patch_dir/room-queue-owntone.patch"
          git apply "$patch_dir/room-queue-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/owntone-start-proof.sha256" | sha256sum -c -
          git apply --check "$patch_dir/room-start-proof-owntone.patch"
          git apply "$patch_dir/room-start-proof-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-recovery-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-recovery-owntone.patch"
          git apply "$patch_dir/connect-recovery-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-recovery-diagnostics-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-recovery-diagnostics-owntone.patch"
          git apply "$patch_dir/connect-recovery-diagnostics-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/paused-route-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/paused-route-owntone.patch"
          git apply "$patch_dir/paused-route-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-recovery-busy-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-recovery-busy-owntone.patch"
          git apply "$patch_dir/connect-recovery-busy-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/fifo-reader-handoff-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/fifo-reader-handoff-owntone.patch"
          git apply "$patch_dir/fifo-reader-handoff-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/start-starvation-owner-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/start-starvation-owner-owntone.patch"
          git apply "$patch_dir/start-starvation-owner-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/paused-track-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/paused-track-owntone.patch"
          git apply "$patch_dir/paused-track-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-closed-prior-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-closed-prior-owntone.patch"
          git apply "$patch_dir/connect-closed-prior-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-atomic-init-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-atomic-init-owntone.patch"
          git apply "$patch_dir/connect-atomic-init-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-retired-autostart-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-retired-autostart-owntone.patch"
          git apply "$patch_dir/connect-retired-autostart-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-resume-prepcm-busy-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-resume-prepcm-busy-owntone.patch"
          git apply "$patch_dir/connect-resume-prepcm-busy-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/connect-retired-owner-detach-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/connect-retired-owner-detach-owntone.patch"
          git apply "$patch_dir/connect-retired-owner-detach-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/ordinary-pause-ack-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/ordinary-pause-ack-owntone.patch"
          git apply "$patch_dir/ordinary-pause-ack-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/pipe-metadata-owner-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/pipe-metadata-owner-owntone.patch"
          git apply "$patch_dir/pipe-metadata-owner-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/first-pcm-clock-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/first-pcm-clock-owntone.patch"
          git apply "$patch_dir/first-pcm-clock-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/purpose-bound-transport-ack-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/purpose-bound-transport-ack-owntone.patch"
          git apply "$patch_dir/purpose-bound-transport-ack-owntone.patch"
          sed "s@ /patches/@ $patch_dir/@" "$patch_dir/move-first-pcm-clock-owntone.sha256" | sha256sum -c -
          git apply --check "$patch_dir/move-first-pcm-clock-owntone.patch"
          git apply "$patch_dir/move-first-pcm-clock-owntone.patch"
          # The same Docker suffix includes the prior five CI-only fixtures.
          for checksum in room-release-owntone.sha256 room-owner-parity-owntone.sha256; do
            sed "s@ /patches/@ $patch_dir/@" "$patch_dir/$checksum" | sha256sum -c -
          done
          for patch in room-release-owntone.patch room-release-owntone-tests.patch room-release-owntone-timer-tests.patch room-release-owntone-target2-tests.patch room-owner-parity-owntone.patch room-owner-parity-owntone-tests.patch; do
            git apply --check "$patch_dir/$patch"
            git apply "$patch_dir/$patch"
          done
      - name: Compile and run actual queue C owner modes
        run: |
          set -Eeuo pipefail
          cd /tmp/owntone
          dump_owner_logs() {
            status=$?
            if [ "$status" -ne 0 ]; then
              for log in src/test-suite.log src/outputs_attention_owner.log src/airplay_callback_owner.log; do
                if [ -f "$log" ]; then
                  printf '\n=== %s ===\n' "$log"
                  sudo -n cat "$log" || true
                else
                  printf '\n=== %s missing ===\n' "$log"
                fi
              done
            fi
            exit "$status"
          }
          trap dump_owner_logs EXIT
          autoreconf -fi
          ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-install_systemd --disable-install_user
          make -j"$(nproc)"
          sudo -n make check
          sudo -n src/outputs_attention_owner --deployed-uid-proc
          sudo -n src/airplay_callback_owner --queue-wire
          sudo -n env PC_ATTENTION_RESTORE_CASE=1 src/airplay_callback_owner --start-retire-wire
          sudo -n env PC_ATTENTION_RECOVER_BUSY=1 src/airplay_callback_owner --attention-recovery-wire
          sudo -n src/airplay_callback_owner --metadata-pipe-owner
          sudo -n env PC_MOVE_CLOCK_PROBE=1 PC_HOLD_MOVE_SETUP=1 timeout 15 src/airplay_callback_owner --move-wire
          sudo -n env PC_MOVE_CLOCK_PROBE=1 PC_HOLD_MOVE_SETUP=1 PC_MOVE_CLOCK_PAUSED=1 timeout 15 src/airplay_callback_owner --move-wire
          sudo -n timeout 25 src/airplay_callback_owner --move-pause-resume-wire
          sudo -n src/airplay_callback_owner --queue-connect-wire
          sudo -n src/airplay_callback_owner --move-retire-wire
          sudo -n src/airplay_callback_owner --move-retire-live-wire
          sudo -n src/airplay_callback_owner --move-retire-resume-prime-wire
          sudo -n src/airplay_callback_owner --start-retire-normal-reconnect-wire
          sudo -n src/airplay_callback_owner --start-retire-closed-wire
          sudo -n src/airplay_callback_owner --start-retire-closed-no-session-wire
          sudo -n src/airplay_callback_owner --start-retire-closed-empty-wire
      - uses: actions/upload-artifact@v4
        with:
          name: selected-c-callback
          path: |
            /tmp/owntone/src/airplay_callback_owner
            /tmp/owntone/sqlext/.libs/owntone-sqlext.so
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  selected-start-clock:
    needs: [build-fork, build-owntone]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shared libraries for the existing compiled fixtures
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev
          libgcrypt20-dev libplist-dev libjson-c-dev libevent-dev libxml2-dev
          libsodium-dev libcurl4-openssl-dev libconfuse-dev libprotobuf-c-dev
          libavahi-client-dev libwebsockets-dev libasound2-dev libsqlite3-dev
          libunistring-dev libflac-dev libvorbis-dev libogg-dev
      - uses: actions/download-artifact@v4
        with:
          name: selected-c-callback
          path: /tmp/owntone
      - uses: actions/download-artifact@v4
        with:
          name: selected-native-tests
          path: /tmp/owntone
      - name: Verify held fresh START and explicit late paused Resume against actual C
        working-directory: /tmp/owntone
        run: |
          set -Eeuo pipefail
          chmod +x src/airplay_callback_owner native-tests
          ldd src/airplay_callback_owner
          ldd native-tests
          if ldd src/airplay_callback_owner native-tests | grep -q 'not found'; then exit 1; fi
          trap 'status=$?; if [ "$status" -ne 0 ]; then cat pc52-selected-*-c.log pc52-selected-*-native.log 2>/dev/null || true; fi; exit "$status"' EXIT
          sudo -n env PC_FIXTURE_ROOT=/tmp/owntone PC_NATIVE_TEST_BIN=/tmp/owntone/native-tests PC_METADATA_PRESENT=1 PC_REQUIRE_RTP_AUDIO=1 PC_HOLD_START_SETUP=1 PC_REQUIRE_FIRST_SYNC_CLOCK=1 python3 "$GITHUB_WORKSPACE/.github/fixtures/run-selected-composed.py" actual-c-selected-rtp
          sudo -n env PC_FIXTURE_ROOT=/tmp/owntone PC_NATIVE_TEST_BIN=/tmp/owntone/native-tests PC_METADATA_PRESENT=1 PC_REQUIRE_RTP_AUDIO=1 PC_LATE_PAUSED_RESUME=1 PC_REQUIRE_FIRST_SYNC_CLOCK=1 python3 "$GITHUB_WORKSPACE/.github/fixtures/run-selected-composed.py" actual-c-paused
          sudo -n env PC_FIXTURE_ROOT=/tmp/owntone PC_NATIVE_TEST_BIN=/tmp/owntone/native-tests PC_NATIVE_START_EXPECT_PAUSE_RETAINED=1 PC_NATIVE_START_EXPECT_PAUSE_LOSS=1 python3 "$GITHUB_WORKSPACE/.github/fixtures/run-selected-composed.py" actual-c-native-pause
          cold_root="$(mktemp -d /tmp/pc70-cold.XXXXXX)"
          sudo -n env PC_FIXTURE_ROOT=/tmp/owntone PC_NATIVE_TEST_BIN=/tmp/owntone/native-tests PC_REQUIRE_RTP_AUDIO=1 PC70_ROLLBACK_COMPAT=1 PC70_COLD_DATABASE="$cold_root/release.db" PC70_COLD_FIFO="$cold_root/release.fifo" PC70_RELEASE_COMPOSE=move python3 "$GITHUB_WORKSPACE/.github/fixtures/run-selected-composed.py" actual-c-selected-rtp
          sudo -n env PC_FIXTURE_ROOT=/tmp/owntone PC_NATIVE_TEST_BIN=/tmp/owntone/native-tests PC_REQUIRE_RTP_AUDIO=1 PC70_ROLLBACK_COMPAT=1 PC70_COLD_DATABASE="$cold_root/release.db" PC70_COLD_FIFO="$cold_root/release.fifo" PC70_COLD_RESTART=1 python3 "$GITHUB_WORKSPACE/.github/fixtures/run-selected-composed.py" actual-c-selected-rtp
