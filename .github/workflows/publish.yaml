name: Publish add-on image

# Builds the add-on image and publishes per-arch images to GHCR, so installing on the HA
# Green PULLS a ready image instead of compiling on-device.
#
# IMPORTANT: aarch64 is built on a NATIVE ARM runner with plain buildx (NOT emulation and
# NOT the home-assistant/builder action — that action only runs on amd64). Cross-building
# arm64 under QEMU produced corrupt layers ("invalid tar header") on the real device.
on:
  push:
    branches: [main]
    paths:
      - "podconnect/Dockerfile"
      - "podconnect/build.yaml"
      - "podconnect/patches/**"
      - "podconnect/config.yaml"
      - "podconnect/rootfs/**"
      - "podconnect/manager/**" # the manager binary is compiled into the image
      - ".github/workflows/publish.yaml"
  workflow_dispatch:

jobs:
  publish:
    name: publish-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-debian:bookworm
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-debian:bookworm
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: ver
        run: |
          version=$(grep '^version:' podconnect/config.yaml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release version
        shell: bash
        run: |
          set +e
          inspect_output="$(docker buildx imagetools inspect \
            ghcr.io/bixelventures/${{ matrix.arch }}-podconnect:${{ steps.ver.outputs.version }} 2>&1)"
          inspect_status=$?
          set -e
          if [ "$inspect_status" -eq 0 ]; then
            echo "Release version already exists and is immutable." >&2
            exit 1
          fi
          case "$inspect_output" in
            *"manifest unknown"*|*"ghcr.io/bixelventures/${{ matrix.arch }}-podconnect:${{ steps.ver.outputs.version }}: not found"*) ;;
            *)
              echo "$inspect_output" >&2
              exit "$inspect_status"
              ;;
          esac

      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./podconnect
          file: ./podconnect/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/bixelventures/${{ matrix.arch }}-podconnect:${{ steps.ver.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
