# Explicit optional offline profile; never included in the existing HA app.
services:
  radio-candidate:
    profiles: [radio-isolated]
    image: ${PODCONNECT_RADIO_CANDIDATE_IMAGE:?locally built candidate image required}
    pull_policy: never
    user: "0:0"
    cgroup: private
    cgroup_parent: ${PODCONNECT_RADIO_DELEGATION_SCOPE:?unique /pv-radio- task parent required}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt:
      - seccomp=${PODCONNECT_RADIO_SECCOMP_PROFILE:?absolute checked-in clone3 profile required}
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    environment:
      PODCONNECT_RADIO_DELEGATION_SCOPE: ${PODCONNECT_RADIO_DELEGATION_SCOPE}
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=536870912,mode=1777
      - /run:rw,nosuid,nodev,size=33554432,mode=755
    volumes:
      - type: bind
        source: ${PODCONNECT_RADIO_HOST_PARENT:?exact predelegated host cgroup path required}
        target: /run/task-cgroup${PODCONNECT_RADIO_DELEGATION_SCOPE}
      - type: bind
        source: ./delegate-entry.sh
        target: /radio-runtime/delegate-entry.sh
        read_only: true
      - type: bind
        source: ${PODCONNECT_RADIO_PRIVATE_DATA:?fresh manager-private data required}
        target: /data
    entrypoint: [/bin/sh, /radio-runtime/delegate-entry.sh]
    command: ["${PODCONNECT_RADIO_ORIGINAL_ENTRYPOINT:?original candidate entrypoint required}"]
