play_from_library:
  name: Play from library
  description: >-
    Play the user's own Spotify collection on a PodConnect speaker — Liked Songs, top tracks, or
    recently played. The "play something I like / play my recent" tool for voice assistants.
  target:
    entity:
      integration: podconnect
      domain: media_player
  fields:
    source:
      name: Source
      description: Which of the user's collections to play.
      required: true
      example: top_tracks
      selector:
        select:
          options:
            - liked
            - top_tracks
            - recent
    shuffle:
      name: Shuffle
      description: Shuffle the collection before playing.
      required: false
      default: false
      selector:
        boolean:

top_tracks:
  name: Get top tracks
  description: >-
    Returns the selected account's Spotify top tracks as response data, including the selected
    config_entry_id. Each track has name, artist, uri and optional validated Spotify artwork. Omit
    the account only when exactly one PodConnect account is active.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect

recently_played:
  name: Get recently played
  description: >-
    Returns the selected account's recently played tracks as response data, including the selected
    config_entry_id. Each track has name, artist, uri and optional validated Spotify artwork. Omit
    the account only when exactly one PodConnect account is active.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect

liked:
  name: Get liked songs
  description: >-
    Returns the selected account's Liked Songs as response data, including the selected
    config_entry_id. Each track has name, artist, uri and optional validated Spotify artwork. Omit
    the account only when exactly one PodConnect account is active.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect

search_tracks:
  name: Search Spotify tracks
  description: >-
    Read-only search of Spotify's actual track results for a non-empty query. Returns at most 20
    source rows (default 3) with account/source/sample provenance and optional validated artwork.
    Search results do not grant playback authority.
  fields:
    config_entry_id:
      name: Account entry
      required: true
      selector:
        config_entry:
          integration: podconnect
    query:
      name: Search query
      description: A query for Spotify's track search endpoint, up to 160 characters.
      required: true
      example: "jazz guitar"
      selector:
        text:
    limit:
      name: Maximum results
      description: An exact integer from 1 to 20; defaults to 3.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box

get_targets:
  name: Get playback targets
  description: Without an account entry, lists active account IDs and titles only. With an explicit entry, returns fresh devices, configured aliases and read-only observed outputs. Configuration and selection do not prove audible playback.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect
get_targets_with_context:
  name: Get playback targets with HA context
  description: Same fresh account-scoped catalog as get_targets, with optional authoritative HA entity names, area names and aliases for exact Spotify devices. Language metadata does not create a target or prove audible playback.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect
get_targets_with_room_context:
  name: Get playback targets with HA room context
  description: Same fresh account-scoped catalog as get_targets_with_context, with optional user-selected HA areas for exact configured alias and native output identities. Metadata does not create targets or prove audible playback.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect
move_playback:
  name: Move playback
  description: Request an explicit stable-ID target. Local acceptance and Spotify request acceptance are separate from audible output confirmation.
  fields:
    config_entry_id:
      name: Account entry
      required: true
      selector:
        config_entry:
          integration: podconnect
    kind:
      name: Target kind
      required: true
      selector:
        select:
          options:
            - configured_alias
            - spotify_device
    target_id:
      name: Target ID
      required: true
      selector:
        text:

get_playback_snapshot:
  name: Get observed playback
  description: Account-scoped successful Spotify poll, with owner generation and freshness. Never optimistic HA entity state or audible proof. Does not request a new poll.
  fields:
    config_entry_id:
      name: Account entry
      required: true
      selector:
        config_entry:
          integration: podconnect
    include_output:
      name: Include observed native output
      description: Optional passive Native/C output correlation. Adds playback.v2 output; grants no action or physical-result proof.
      required: false
      default: false
      selector:
        boolean:

get_queue:
  name: Get observed queue
  description: Read the selected account's Spotify queue. Preserves source order and duplicates; each occurrence ID belongs to this observation only. Not an atomic speaker/playback snapshot.
  fields:
    config_entry_id:
      name: Account entry
      required: true
      selector:
        config_entry:
          integration: podconnect
    limit:
      name: Maximum items
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 20
          mode: box

get_playback_controls:
  name: Get direct playback controls
  description: Exact account and direct Spotify device only. Observed capabilities and volume, never optimistic entity state, alias selection or physical proof.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: podconnect
    kind:
      required: true
      selector:
        select:
          options: [spotify_device]
    target_id:
      required: true
      selector:
        text:

get_track_play_controls:
  name: Get selected-track play controls
  description: Exact account, fresh Spotify device and native Speakers room/output/start policy. The source observation is not permission to play a browser-provided URI or proof of audible output.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: podconnect
    kind:
      required: true
      selector:
        select:
          options: [spotify_device]
    target_id:
      required: true
      selector:
        text:
    room_id:
      required: true
      selector:
        text:

control_playback:
  name: Control direct Spotify playback
  description: One bounded command on the exact observed account/device/owner/poll. play_track also requires the native room, output, start policy revision and alias incarnation returned by get_track_play_controls; max_volume must be at least the fixed native start level. A caller must separately authorize the selected source. Unknown outcomes must not be retried. No physical confirmation.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: podconnect
    kind:
      required: true
      selector:
        select:
          options: [spotify_device]
    target_id:
      required: true
      selector:
        text:
    owner_epoch:
      required: true
      selector:
        text:
    expected_poll_sequence:
      required: true
      selector:
        number:
          min: 1
          mode: box
    command_sequence:
      name: Command sequence
      description: Exact next sequence from get_playback_controls, within this owner epoch.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9007199254740991
          mode: box
    request_id:
      description: Exact owner_epoch:command_sequence identity, never a browser UUID.
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options: [pause, resume, next, previous, volume, play_track, play_context, play_queue_occurrence]
    args:
      required: true
      selector:
        object:

search_playlists:
  name: Search exact-account Spotify playlists
  description: Bounded real playlist contexts from one configured account and owner epoch; no playback authority.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    query:
      required: true
      selector:
        text:
    limit:
      default: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
    include_artwork:
      required: false
      default: false
      selector:
        boolean:
