play_from_library:
  name: Play from library
  description: >-
    Play the user's own Spotify collection on a PodConnect speaker — Liked Songs, top tracks, or
    recently played. The "play something I like / play my recent" tool for voice assistants.
  target:
    entity:
      integration: podconnect
      domain: media_player
  fields:
    source:
      name: Source
      description: Which of the user's collections to play.
      required: true
      example: top_tracks
      selector:
        select:
          options:
            - liked
            - top_tracks
            - recent
    shuffle:
      name: Shuffle
      description: Shuffle the collection before playing.
      required: false
      default: false
      selector:
        boolean:

top_tracks:
  name: Get top tracks
  description: >-
    Returns the user's Spotify top tracks as {tracks:[{name,artist,uri}]} (response data). A
    listening-history "data tool" an AI assist can fetch, then play a chosen URI. Account-wide.

recently_played:
  name: Get recently played
  description: >-
    Returns the user's recently played tracks as {tracks:[{name,artist,uri}]} (response data).

liked:
  name: Get liked songs
  description: >-
    Returns the user's Liked Songs as {tracks:[{name,artist,uri}]} (response data).

get_targets:
  name: Get playback targets
  description: Without an account entry, lists active account IDs and titles only. With an explicit entry, returns fresh devices, configured aliases and read-only observed outputs. Configuration and selection do not prove audible playback.
  fields:
    config_entry_id:
      name: Account entry
      required: false
      selector:
        config_entry:
          integration: podconnect
move_playback:
  name: Move playback
  description: Request an explicit stable-ID target. Local acceptance and Spotify request acceptance are separate from audible output confirmation.
  fields:
    config_entry_id:
      name: Account entry
      required: true
      selector:
        config_entry:
          integration: podconnect
    kind:
      name: Target kind
      required: true
      selector:
        select:
          options:
            - configured_alias
            - spotify_device
    target_id:
      name: Target ID
      required: true
      selector:
        text:
